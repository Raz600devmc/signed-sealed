plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '2.2.0'
group = 'ru.realdocs'
base { archivesName = 'signed-and-sealed-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { signedsealed { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest {
        attributes([
            'Specification-Title': 'signedsealed',
            'Specification-Vendor': 'Raz600',
            'Specification-Version': '1',
            'Implementation-Title': 'realdocs',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Raz600',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

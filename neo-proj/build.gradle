plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '2.5.1'
group = 'ru.realdocs'
base { archivesName = 'signed-and-sealed-neoforge-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.265'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        signedsealed { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest {
        attributes(
            'Specification-Title': 'signedsealed',
            'Specification-Vendor': 'Raz600',
            'Specification-Version': '1',
            'Implementation-Title': 'signedsealed',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Raz600'
        )
    }
}
